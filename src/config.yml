api:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OpenRouter_API_KEY"

# モデル設定
model:
  name: "deepseek/deepseek-v4-flash-0731:deepinfra/fp8"
  temperature: 1.0
  max_tokens: null

# 推論 (Reasoning / Thinking) 設定
reasoning:
  enabled: true

# プロバイダ固定設定 (OpenRouter用)
provider:
  order: ["deepinfra"]
  allow_fallbacks: false

# 02_to_MBTI_like.py 実験用設定
experiment:
  max_rating_retries: 3
  max_tiebreak_retries: 3
